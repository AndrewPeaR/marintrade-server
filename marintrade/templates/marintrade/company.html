{% extends "base.html" %}
{% load static %}

{% block content %}
<section>
    <div class="wrapper">
        <div class="company">
            <div class="company__image">
                <img src="{{ company.image.url }}" alt="{{ company.image.url }}">
            </div>
            <div class="company__info">
                <div class="company__header">
                    <h2 class="company__title">{{ company.name }}</h2>
                    <div class="company__tags">
                        {% for item in company.company_tag.all %}
                        <div class="company__tag">
                            {{ item }}
                        </div>
                        {% endfor %}
                    </div>
                </div>
                <div class="company__description">
                    <p>
                        {{ company.description }}
                    </p>
                </div>
                <div class="btn-wrapper">
                    <a href="{{ company.official_site }}" class="btn btn_padding">Официальный сайт</a>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
